name: FomoScan WebSocket Test

run-name: FomoScan WS Test - ${{ inputs.duration }}s

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How many seconds to keep the WebSocket open"
        required: true
        default: "10"
        type: string

jobs:
  websocket-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ws
        run: npm install ws

      - name: Run FomoScan WebSocket test
        env:
          FOMOSCAN_API_KEY: ${{ secrets.FOMOSCAN_API_KEY }}
          TEST_DURATION: ${{ inputs.duration }}
        run: |
          node <<'EOF'
          const WebSocket = require("ws");

          const apiKey = process.env.FOMOSCAN_API_KEY;
          const duration = Number(process.env.TEST_DURATION || 10);

          if (!apiKey) {
            throw new Error("FOMOSCAN_API_KEY secret is missing.");
          }

          console.log(`Testing FomoScan WebSocket for ${duration} seconds...`);
          console.log("Connecting...");

          const ws = new WebSocket(
            "wss://api.fomoscan.sh/v2/ws",
            {
              headers: {
                Authorization: `Bearer ${apiKey}`
              }
            }
          );

          let messageCount = 0;
          let thesisCount = 0;

          ws.on("open", () => {
            console.log("WEBSOCKET_CONNECTED");

            const subscription = {
              type: "subscribe",
              subscription: {
                type: "all"
              }
            };

            console.log("Sending subscription:");
            console.log(JSON.stringify(subscription));

            ws.send(JSON.stringify(subscription));

            console.log(
              `Listening for ${duration} seconds...`
            );

            setTimeout(() => {
              console.log("");
              console.log("TEST_TIME_FINISHED");
              console.log(`Messages received: ${messageCount}`);
              console.log(`Thesis messages: ${thesisCount}`);
              console.log("Closing WebSocket...");

              ws.close(1000, "Test finished");
            }, duration * 1000);
          });

          ws.on("message", (data) => {
            messageCount++;

            const text = data.toString();

            console.log("");
            console.log(`--- MESSAGE ${messageCount} ---`);
            console.log(text);

            try {
              const message = JSON.parse(text);

              if (message.type === "thesis") {
                thesisCount++;

                console.log("");
                console.log("***** THESIS EVENT *****");
                console.log(JSON.stringify(message.data, null, 2));
                console.log("************************");
              }
            } catch {
              console.log("Non-JSON message received.");
            }
          });

          ws.on("error", (error) => {
            console.error("WEBSOCKET_ERROR");
            console.error(error.message);
          });

          ws.on("close", (code, reason) => {
            console.log("");
            console.log(`WEBSOCKET_CLOSED code=${code}`);
            console.log(
              `reason=${reason?.toString() || "(none)"}`
            );
          });
          EOF
