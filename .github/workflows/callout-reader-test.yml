name: FomoScan WebSocket Test

on:
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "How long to listen to the WebSocket (10-60 seconds)"
        required: true
        default: "30"

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WebSocket client
        run: npm install ws

      - name: Test FomoScan WebSocket
        env:
          FOMOSCAN_API_KEY: ${{ secrets.FOMOSCAN_API_KEY }}
          RUN_SECONDS: ${{ inputs.run_seconds }}
        run: |
          node <<'NODE'
          const WebSocket = require("ws");

          const apiKey = process.env.FOMOSCAN_API_KEY;
          const seconds = Number(process.env.RUN_SECONDS || "30");

          if (!apiKey) {
            console.error("FOMOSCAN_API_KEY is missing.");
            process.exit(1);
          }

          if (!Number.isInteger(seconds) || seconds < 10 || seconds > 60) {
            console.error("RUN_SECONDS must be between 10 and 60.");
            process.exit(1);
          }

          const url = "wss://api.fomoscan.sh/v2/ws";

          console.log("Connecting to FomoScan WebSocket...");
          console.log(`URL: ${url}`);
          console.log(`Listening for ${seconds} seconds...`);

          const ws = new WebSocket(url, {
            headers: {
              Authorization: `Bearer ${apiKey}`,
              Accept: "application/json"
            }
          });

          let messageCount = 0;

          ws.on("open", () => {
            console.log("WEBSOCKET_CONNECTED");

            console.log(
              "Connection established. Waiting for stream messages..."
            );
          });

          ws.on("message", (data) => {
            messageCount++;

            const text = data.toString();

            console.log(`\n--- MESSAGE ${messageCount} ---`);

            try {
              const parsed = JSON.parse(text);
              console.dir(parsed, {
                depth: 8,
                maxArrayLength: 10
              });
            } catch {
              console.log(text.slice(0, 10000));
            }
          });

          ws.on("error", (error) => {
            console.error(
              "WEBSOCKET_ERROR:",
              error instanceof Error ? error.message : error
            );
          });

          ws.on("close", (code, reason) => {
            console.log(
              `WEBSOCKET_CLOSED code=${code} reason=${reason.toString()}`
            );
          });

          setTimeout(() => {
            console.log(
              `\nFinished. Messages received: ${messageCount}`
            );

            if (ws.readyState === WebSocket.OPEN) {
              ws.close(1000, "Test finished");
            }

            setTimeout(() => process.exit(0), 1000);
          }, seconds * 1000);
          NODE
