name: FomoScan Account Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check FomoScan account
        env:
          FOMOSCAN_API_KEY: ${{ secrets.FOMOSCAN_API_KEY }}
        run: |
          set -e

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${FOMOSCAN_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.fomoscan.sh/v2/me")

          echo "FomoScan account response:"
          echo "$RESPONSE"
