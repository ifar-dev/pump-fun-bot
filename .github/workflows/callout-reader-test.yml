name: FomoScan WebSocket Test

on:
  workflow_dispatch:

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WebSocket client
        run: npm install ws

      - name: Test FomoScan Firehose
        env:
          FOMOSCAN_API_KEY: ${{ secrets.FOMOSCAN_API_KEY }}

        run: |
          node <<'NODE'
          const WebSocket = require("ws");

          const apiKey = process.env.FOMOSCAN_API_KEY;

          if (!apiKey) {
            console.error("FOMOSCAN_API_KEY is missing.");
            process.exit(1);
          }

          const url = "wss://api.fomoscan.sh/v2/ws";

          console.log("Connecting to FomoScan WebSocket...");
          console.log(`URL: ${url}`);
          console.log("Test duration: 10 seconds");
          console.log("Subscription: firehose");

          const ws = new WebSocket(url, {
            headers: {
              Authorization: `Bearer ${apiKey}`,
              Accept: "application/json"
            }
          });

          let messageCount = 0;
          let thesisCount = 0;

          ws.on("open", () => {
            console.log("WEBSOCKET_CONNECTED");

            const subscription = {
              type: "subscribe",
              subscription: {
                type: "firehose"
              }
            };

            console.log(
              "Sending firehose subscription..."
            );

            ws.send(JSON.stringify(subscription));
          });

          ws.on("message", (data) => {
            messageCount++;

            const text = data.toString();

            console.log(`\n--- MESSAGE ${messageCount} ---`);

            try {
              const parsed = JSON.parse(text);

              console.dir(parsed, {
                depth: 8,
                maxArrayLength: 10
              });

              if (parsed.type === "thesis") {
                thesisCount++;

                const thesis = parsed.data || {};

                console.log("\nTHESIS EVENT DETECTED");
                console.log(
                  `ID: ${thesis.id ?? "n/a"}`
                );
                console.log(
                  `Token address: ${thesis.tokenAddress ?? "n/a"}`
                );
                console.log(
                  `Token network: ${thesis.tokenNetwork ?? "n/a"}`
                );
                console.log(
                  `Created: ${thesis.createdAt ?? "n/a"}`
                );
              }
            } catch {
              console.log(text.slice(0, 10000));
            }
          });

          ws.on("error", (error) => {
            console.error(
              "WEBSOCKET_ERROR:",
              error instanceof Error
                ? error.message
                : error
            );
          });

          ws.on("close", (code, reason) => {
            console.log(
              `WEBSOCKET_CLOSED code=${code} reason=${reason.toString()}`
            );
          });

          setTimeout(() => {
            console.log("\n========== TEST COMPLETE ==========");
            console.log(
              `Messages received: ${messageCount}`
            );
            console.log(
              `Thesis events received: ${thesisCount}`
            );

            if (ws.readyState === WebSocket.OPEN) {
              ws.close(1000, "10 second test finished");
            }

            setTimeout(() => {
              process.exit(0);
            }, 1000);
          }, 10000);
          NODE
